<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Mental | MecânicaPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }

    /* ══════════════════════════════════════
       HEADER
    ══════════════════════════════════════ */
    .mmh {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 54px;
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 2px solid rgba(99,102,241,.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      gap: 1rem;
      z-index: 1000;
    }

    .mmh__left {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-shrink: 0;
    }

    .mmh__back {
      color: rgba(255,255,255,.55);
      text-decoration: none;
      font-size: .8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .4rem;
      transition: color .2s;
      white-space: nowrap;
    }
    .mmh__back:hover { color: #fff; }

    .mmh__logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .95rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
    }
    .mmh__logo-icon { font-size: 1.1rem; color: #818cf8; }

    .mmh__sep { width: 1px; height: 22px; background: rgba(255,255,255,.15); }

    .mmh__subtitle {
      font-size: .78rem;
      color: rgba(255,255,255,.45);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mmh__controls {
      display: flex;
      align-items: center;
      gap: .35rem;
      flex-shrink: 0;
    }

    .mmh__btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.8);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .18s, color .18s, border-color .18s;
      font-family: inherit;
      font-weight: 700;
    }
    .mmh__btn:hover {
      background: rgba(99,102,241,.35);
      border-color: rgba(99,102,241,.6);
      color: #fff;
    }

    .mmh__zoom-pill {
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      padding: 0 .75rem;
      height: 32px;
      display: flex;
      align-items: center;
      font-size: .78rem;
      font-weight: 700;
      color: rgba(255,255,255,.65);
      min-width: 52px;
      justify-content: center;
    }

    /* ══════════════════════════════════════
       CANVAS
    ══════════════════════════════════════ */
    .mm-canvas {
      position: fixed;
      top: 54px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      cursor: grab;
      /* Dot grid */
      background-color: #eef2f7;
      background-image:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(255,255,255,.65) 0%, transparent 100%),
        radial-gradient(circle, #b8c4d8 1.1px, transparent 1.1px);
      background-size: 100% 100%, 28px 28px;
    }
    .mm-canvas.panning { cursor: grabbing; }

    /* ══════════════════════════════════════
       WORLD
    ══════════════════════════════════════ */
    .mm-world {
      position: absolute;
      width: 2600px;
      height: 1600px;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* SVG layer */
    .mm-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    /* ══════════════════════════════════════
       NODES — base
    ══════════════════════════════════════ */
    .mm-node {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    .mm-node__body {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 20px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: default;
      user-select: none;
      position: relative;
      transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
    }

    /* ══════════════════════════════════════
       ROOT NODE
    ══════════════════════════════════════ */
    .mm-node--root .mm-node__body {
      padding: 17px 28px;
      background: linear-gradient(140deg, #1e3a5f 0%, #0f172a 100%);
      border: 2px solid rgba(255,255,255,.12);
      box-shadow:
        0 0 0 5px rgba(99,102,241,.2),
        0 0 0 10px rgba(99,102,241,.08),
        0 16px 48px rgba(0,0,0,.35),
        0 4px 12px rgba(0,0,0,.2);
      animation: root-pulse 3.5s ease-in-out infinite;
    }

    @keyframes root-pulse {
      0%, 100% {
        box-shadow: 0 0 0 5px rgba(99,102,241,.2), 0 0 0 10px rgba(99,102,241,.08),
                    0 16px 48px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.2);
      }
      50% {
        box-shadow: 0 0 0 7px rgba(99,102,241,.32), 0 0 0 16px rgba(99,102,241,.06),
                    0 16px 48px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.2);
      }
    }

    .mm-node--root .mm-node__body:hover { transform: scale(1.04); }

    .mm-node__icon {
      font-size: 1.4rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .mm-node--root .mm-node__icon { font-size: 1.6rem; }

    .mm-node__label {
      font-size: .86rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: .01em;
    }
    .mm-node--root .mm-node__label { font-size: 1.1rem; font-weight: 800; }

    /* ══════════════════════════════════════
       EXPAND BUTTON
    ══════════════════════════════════════ */
    .mm-expand {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.9);
      color: #1e293b;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
      font-family: inherit;
      padding: 0;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      transition: background .18s, box-shadow .18s, transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .mm-expand:hover {
      background: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.3);
      transform: scale(1.12);
    }
    .mm-expand.open { transform: rotate(45deg) scale(1.08); }

    /* ══════════════════════════════════════
       CHILD NODES
    ══════════════════════════════════════ */
    .mm-node--child {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) translateX(-60px) scale(0.5);
      transition:
        opacity  .3s ease,
        transform .38s cubic-bezier(.34,1.56,.64,1);
    }
    .mm-node--child.show {
      opacity: 1;
      pointer-events: all;
      transform: translate(-50%, -50%) scale(1);
    }

    .mm-node--child .mm-node__body {
      padding: 11px 18px;
      border: none;
      box-shadow:
        0 4px 18px var(--shadow, rgba(0,0,0,.18)),
        0 1px 4px rgba(0,0,0,.1),
        inset 0 1px 0 rgba(255,255,255,.18);
    }
    .mm-node--child.show .mm-node__body:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow:
        0 10px 28px var(--shadow, rgba(0,0,0,.22)),
        0 3px 8px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.2);
    }

    /* ══════════════════════════════════════
       HINT
    ══════════════════════════════════════ */
    .mm-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,.78);
      backdrop-filter: blur(8px);
      color: rgba(255,255,255,.85);
      font-size: .74rem;
      font-weight: 500;
      padding: .45rem 1.2rem;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>

  <header class="mmh">
    <div class="mmh__left">
      <a href="index.html" class="mmh__back">← Voltar</a>
      <div class="mmh__sep"></div>
      <div class="mmh__logo">
        <span class="mmh__logo-icon">⚙</span>
        Mecânica<strong>Pro</strong>
      </div>
      <div class="mmh__sep"></div>
      <span class="mmh__subtitle">Mapa Mental — Mecânica Automotiva</span>
    </div>
    <div class="mmh__controls">
      <button class="mmh__btn" id="btn-zo" title="Diminuir zoom">−</button>
      <div class="mmh__zoom-pill"><span id="zoom-lbl">100%</span></div>
      <button class="mmh__btn" id="btn-zi" title="Aumentar zoom">+</button>
      <button class="mmh__btn" id="btn-zr" title="Centralizar vista">⊙</button>
    </div>
  </header>

  <div class="mm-canvas" id="mm-canvas">
    <div class="mm-world" id="mm-world">
      <svg class="mm-svg" id="mm-svg"></svg>
    </div>
    <div class="mm-hint" id="mm-hint">
      Arraste para mover &nbsp;·&nbsp; Scroll para zoom &nbsp;·&nbsp; Clique em <strong>+</strong> para expandir
    </div>
  </div>

<script>
// ══════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════
const ROOT_CX  = 320;
const ROOT_CY  = 800;
const CHILD_CX = 860;
const SPACING  = 96;

const CHILDREN = [
  { id:'estrutura',     icon:'🏗️', label:'Estrutura do carro',
    bg:'linear-gradient(135deg,#4ade80 0%,#15803d 100%)',
    shadow:'rgba(21,128,61,.38)', curve:'#16a34a' },

  { id:'motor',         icon:'🔥', label:'Motor',
    bg:'linear-gradient(135deg,#f87171 0%,#dc2626 100%)',
    shadow:'rgba(220,38,38,.38)', curve:'#ef4444' },

  { id:'injecao',       icon:'⛽', label:'Sistema de injeção',
    bg:'linear-gradient(135deg,#60a5fa 0%,#2563eb 100%)',
    shadow:'rgba(37,99,235,.38)', curve:'#3b82f6' },

  { id:'arrefecimento', icon:'🌡️', label:'Sistema de arrefecimento',
    bg:'linear-gradient(135deg,#38bdf8 0%,#0891b2 100%)',
    shadow:'rgba(8,145,178,.38)', curve:'#0ea5e9' },

  { id:'suspensao',     icon:'🛞', label:'Suspensão',
    bg:'linear-gradient(135deg,#c084fc 0%,#7c3aed 100%)',
    shadow:'rgba(124,58,237,.38)', curve:'#a855f7' },

  { id:'freio',         icon:'🛑', label:'Sistema de freio',
    bg:'linear-gradient(135deg,#fb923c 0%,#ea580c 100%)',
    shadow:'rgba(234,88,12,.38)', curve:'#f97316' },

  { id:'direcao',       icon:'🎯', label:'Sistema de direção',
    bg:'linear-gradient(135deg,#2dd4bf 0%,#0d9488 100%)',
    shadow:'rgba(13,148,136,.38)', curve:'#14b8a6' },

  { id:'escapamento',   icon:'💨', label:'Sistema de escapamento',
    bg:'linear-gradient(135deg,#94a3b8 0%,#475569 100%)',
    shadow:'rgba(71,85,105,.38)', curve:'#64748b' },

  { id:'gases',         icon:'♻️', label:'Reaproveitamento de gases',
    bg:'linear-gradient(135deg,#34d399 0%,#059669 100%)',
    shadow:'rgba(5,150,105,.38)', curve:'#10b981' },

  { id:'arcond',        icon:'❄️', label:'Ar condicionado',
    bg:'linear-gradient(135deg,#818cf8 0%,#4f46e5 100%)',
    shadow:'rgba(79,70,229,.38)', curve:'#6366f1' },
];

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
const canvas  = document.getElementById('mm-canvas');
const world   = document.getElementById('mm-world');
const svgEl   = document.getElementById('mm-svg');
const zoomLbl = document.getElementById('zoom-lbl');
const hint    = document.getElementById('mm-hint');

let tr        = { x: 0, y: 0, scale: 1 };
let isPanning = false;
let panStart  = { x: 0, y: 0 };
let expanded  = false;
let curves    = [];

let rootRightX   = ROOT_CX + 95;
const childLeftX = {};

// ══════════════════════════════════════════════════════════════
// TRANSFORM
// ══════════════════════════════════════════════════════════════
function applyTr() {
  world.style.transform = `translate(${tr.x}px,${tr.y}px) scale(${tr.scale})`;
  zoomLbl.textContent   = Math.round(tr.scale * 100) + '%';
}

function centerRoot() {
  const r  = canvas.getBoundingClientRect();
  tr.x     = r.width  / 2 - ROOT_CX;
  tr.y     = r.height / 2 - ROOT_CY;
  tr.scale = 1;
  applyTr();
}

// ══════════════════════════════════════════════════════════════
// PAN — mouse
// ══════════════════════════════════════════════════════════════
canvas.addEventListener('mousedown', e => {
  if (e.target.closest('.mm-expand, .mm-node__body')) return;
  isPanning = true;
  panStart  = { x: e.clientX - tr.x, y: e.clientY - tr.y };
  canvas.classList.add('panning');
});
document.addEventListener('mousemove', e => {
  if (!isPanning) return;
  tr.x = e.clientX - panStart.x;
  tr.y = e.clientY - panStart.y;
  applyTr();
});
document.addEventListener('mouseup', () => {
  isPanning = false;
  canvas.classList.remove('panning');
});

// PAN + PINCH — touch
let lastTouch  = null;
let pinchStart = null;

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    lastTouch  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    pinchStart = null;
  } else if (e.touches.length === 2) {
    lastTouch  = null;
    const d    = dist(e.touches[0], e.touches[1]);
    pinchStart = {
      d, scale: tr.scale, tx: tr.x, ty: tr.y,
      cx: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      cy: (e.touches[0].clientY + e.touches[1].clientY) / 2,
    };
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && lastTouch) {
    tr.x += e.touches[0].clientX - lastTouch.x;
    tr.y += e.touches[0].clientY - lastTouch.y;
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    applyTr();
  } else if (e.touches.length === 2 && pinchStart) {
    const d  = dist(e.touches[0], e.touches[1]);
    const ns = clamp(pinchStart.scale * d / pinchStart.d, .2, 3);
    const sc = ns / pinchStart.scale;
    const rect = canvas.getBoundingClientRect();
    tr.x     = (pinchStart.cx - rect.left) - sc * ((pinchStart.cx - rect.left) - pinchStart.tx);
    tr.y     = (pinchStart.cy - rect.top)  - sc * ((pinchStart.cy - rect.top)  - pinchStart.ty);
    tr.scale = ns;
    applyTr();
  }
}, { passive: true });

canvas.addEventListener('touchend', () => { lastTouch = pinchStart = null; });

// ══════════════════════════════════════════════════════════════
// ZOOM
// ══════════════════════════════════════════════════════════════
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f  = e.deltaY < 0 ? 1.12 : 0.9;
  const ns = clamp(tr.scale * f, .18, 3.5);
  const sc = ns / tr.scale;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  tr.x = mx - sc * (mx - tr.x);
  tr.y = my - sc * (my - tr.y);
  tr.scale = ns;
  applyTr();
}, { passive: false });

function zoomBy(f) {
  const r  = canvas.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const ns = clamp(tr.scale * f, .18, 3.5);
  const sc = ns / tr.scale;
  tr.x = cx - sc * (cx - tr.x);
  tr.y = cy - sc * (cy - tr.y);
  tr.scale = ns;
  applyTr();
}

document.getElementById('btn-zi').addEventListener('click', () => zoomBy(1.25));
document.getElementById('btn-zo').addEventListener('click', () => zoomBy(0.8));
document.getElementById('btn-zr').addEventListener('click', centerRoot);

// ══════════════════════════════════════════════════════════════
// NODE CREATION
// ══════════════════════════════════════════════════════════════
function createNode(id, cx, cy, opts) {
  const { label, icon = '', bg, shadow, isRoot = false } = opts;

  const el = document.createElement('div');
  el.className = 'mm-node ' + (isRoot ? 'mm-node--root' : 'mm-node--child');
  el.id = 'node-' + id;
  el.style.left = cx + 'px';
  el.style.top  = cy + 'px';

  const body = document.createElement('div');
  body.className = 'mm-node__body';
  if (bg)     body.style.background = bg;
  if (shadow) body.style.setProperty('--shadow', shadow);

  if (icon) {
    const ico = document.createElement('span');
    ico.className = 'mm-node__icon';
    ico.textContent = icon;
    body.appendChild(ico);
  }

  const lbl = document.createElement('span');
  lbl.className   = 'mm-node__label';
  lbl.textContent = label;
  body.appendChild(lbl);

  if (isRoot) {
    const btn = document.createElement('button');
    btn.type        = 'button';
    btn.className   = 'mm-expand';
    btn.id          = 'btn-expand';
    btn.textContent = '+';
    btn.addEventListener('click', toggleExpand);
    body.appendChild(btn);
  }

  el.appendChild(body);
  world.appendChild(el);
  return el;
}

// ══════════════════════════════════════════════════════════════
// EXPAND / COLLAPSE
// ══════════════════════════════════════════════════════════════
function toggleExpand() {
  expanded = !expanded;
  document.getElementById('btn-expand').classList.toggle('open', expanded);
  expanded ? showChildren() : hideChildren();
}

function showChildren() {
  const totalH = (CHILDREN.length - 1) * SPACING;
  const startY = ROOT_CY - totalH / 2;

  CHILDREN.forEach((c, i) => {
    const cy  = startY + i * SPACING;
    const el  = document.getElementById('node-' + c.id);
    el.style.top = cy + 'px';

    const delay = i * 52;
    el.style.transitionDelay = delay + 'ms';
    setTimeout(() => el.classList.add('show'), 20);

    const lx = childLeftX[c.id] || (CHILD_CX - 120);
    setTimeout(() => curves.push(drawCurve(rootRightX, ROOT_CY, lx, cy, c.curve)), delay + 55);
  });
}

function hideChildren() {
  CHILDREN.forEach(c => {
    const el = document.getElementById('node-' + c.id);
    el.style.transitionDelay = '0ms';
    el.classList.remove('show');
  });
  curves.forEach(p => p.remove());
  curves = [];
}

// ══════════════════════════════════════════════════════════════
// SVG BEZIER CURVES
// ══════════════════════════════════════════════════════════════
function drawCurve(x1, y1, x2, y2, color) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const dx   = (x2 - x1) * 0.48;
  const d    = `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
  path.setAttribute('d', d);
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width', '3');
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('opacity', '.78');
  svgEl.appendChild(path);

  const len = path.getTotalLength();
  path.style.strokeDasharray  = len;
  path.style.strokeDashoffset = len;
  requestAnimationFrame(() => {
    path.style.transition = 'stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)';
    path.style.strokeDashoffset = 0;
  });
  return path;
}

// ══════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════
function dist(a, b) {
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
createNode('carro', ROOT_CX, ROOT_CY, {
  label: 'Carro', icon: '🚗', isRoot: true,
});

CHILDREN.forEach(c => {
  createNode(c.id, CHILD_CX, ROOT_CY, {
    label: c.label, icon: c.icon, bg: c.bg, shadow: c.shadow,
  });
});

// Measure widths for precise curve endpoints
requestAnimationFrame(() => {
  const rb = document.querySelector('#node-carro .mm-node__body');
  if (rb) rootRightX = ROOT_CX + rb.offsetWidth / 2 + 3;

  CHILDREN.forEach(c => {
    const b = document.querySelector(`#node-${c.id} .mm-node__body`);
    if (b) childLeftX[c.id] = CHILD_CX - b.offsetWidth / 2 - 3;
  });
});

window.addEventListener('load', () => {
  centerRoot();
  setTimeout(() => { hint.style.opacity = '0'; }, 5000);
});
</script>
</body>
</html>
