<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Motor em 3D | MecânicaPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #e63329;
      --bg:  #0d1117;
      --painel: rgba(22,27,34,.92);
      --borda: rgba(255,255,255,.12);
      --txt: rgba(255,255,255,.86);
      --txt2: rgba(255,255,255,.5);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--txt);
      display: flex;
      flex-direction: column;
    }

    /* ---------- barra do topo ---------- */
    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .6rem 1rem;
      background: rgba(13,17,23,.95);
      border-bottom: 1px solid var(--borda);
      flex-shrink: 0;
      z-index: 10;
    }

    .topo__esq { display: flex; align-items: center; gap: .85rem; min-width: 0; }

    .topo__voltar {
      color: var(--txt2);
      text-decoration: none;
      font-size: .82rem;
      font-weight: 600;
      white-space: nowrap;
      transition: color .2s;
    }
    .topo__voltar:hover { color: var(--red); }

    .topo__sep { width: 1px; height: 20px; background: var(--borda); flex-shrink: 0; }

    .topo__logo { font-size: .95rem; font-weight: 700; white-space: nowrap; }
    .topo__logo span { color: var(--red); }

    .topo__titulo {
      font-size: .8rem;
      color: var(--txt2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topo__dir { display: flex; align-items: center; gap: .35rem; flex-shrink: 0; }

    .btn-ico {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--borda);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .18s, border-color .18s;
    }
    .btn-ico:hover { background: rgba(230,51,41,.3); border-color: rgba(230,51,41,.6); }

    .pilula {
      height: 32px;
      min-width: 56px;
      padding: 0 .7rem;
      border-radius: 8px;
      border: 1px solid var(--borda);
      background: rgba(255,255,255,.06);
      display: flex; align-items: center; justify-content: center;
      font-size: .76rem; font-weight: 700; color: var(--txt2);
    }

    /* ---------- palco 3D ---------- */
    /* no desktop o painel flutua sobre o palco; no celular ele vira
       uma faixa acima, para não cobrir o motor */
    .area { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .palco { position: relative; flex: 1; min-height: 0; }

    #canvas3d {
      width: 100%; height: 100%; display: block;
      touch-action: none; cursor: grab;
    }
    #canvas3d:active { cursor: grabbing; }

    .dica-uso {
      position: absolute;
      left: 50%; bottom: .8rem;
      transform: translateX(-50%);
      font-size: .72rem;
      color: var(--txt2);
      background: rgba(13,17,23,.75);
      border: 1px solid var(--borda);
      padding: .3rem .85rem;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ---------- rótulos que seguem as peças ---------- */
    #rotulos {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 4;
    }

    .rotulo {
      position: absolute;
      top: 0; left: 0;
      display: none;
      white-space: nowrap;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .01em;
      color: #fff;
      background: rgba(13,17,23,.82);
      border: 1px solid var(--borda);
      border-radius: 999px;
      padding: .18rem .6rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 10px rgba(0,0,0,.45);
    }

    .rotulo--ativo {
      background: var(--red);
      border-color: var(--red);
      box-shadow: 0 2px 14px rgba(230,51,41,.55);
    }

    /* sem os nomes ligados, o rótulo encolhe e fica só a bolinha do número */
    .rotulo--so-num { padding: .12rem; }
    .rotulo--so-num .txt { display: none; }
    .rotulo--so-num .num { margin-right: 0; }

    /* ---------- numeração das peças (ordem de montagem) ---------- */
    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5em;
      height: 1.5em;
      padding: 0 .3em;
      margin-right: .45em;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: .78em;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .rotulo--ativo .num { background: rgba(0,0,0,.32); }
    .peca .num { background: rgba(255,255,255,.13); color: var(--txt2); }
    .peca:hover .num { background: rgba(230,51,41,.6); color: #fff; }
    .peca--ativo .num { background: rgba(0,0,0,.28); color: #fff; }
    .peca--acao .num { display: none; }

    /* ---------- painel de informação (canto superior esquerdo) ---------- */
    .hud {
      position: absolute;
      top: 1rem; left: 1rem;
      width: min(330px, calc(100% - 2rem));
      background: var(--painel);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: .9rem 1rem;
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    .hud__tipo {
      font-size: .68rem; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; color: var(--red);
      margin-bottom: .3rem;
    }

    .hud__nome { font-size: .95rem; font-weight: 700; line-height: 1.35; }

    .hud__msg { font-size: .8rem; line-height: 1.55; color: var(--txt2); margin-top: .6rem; }
    .hud__peca {
      display: flex; align-items: center;
      color: #fff; font-weight: 700; margin-bottom: .25rem;
      font-size: .92rem;
    }
    .hud__nota {
      display: block; margin-top: .5rem;
      font-size: .72rem; line-height: 1.45;
      color: rgba(255,255,255,.34);
      border-top: 1px solid var(--borda); padding-top: .45rem;
    }
    .hud__peca--ok  { color: #4ade80; }
    .hud__peca--erro .num { background: #f87171; }
    .hud__erro { color: #f87171; font-weight: 700; }

    /* progresso da montagem peça por peça */
    .hud__passo {
      display: none;
      margin-top: .5rem; margin-bottom: .35rem;
      font-size: .68rem; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; color: var(--txt2);
    }
    .hud__barra {
      display: none;
      height: 5px; border-radius: 999px;
      background: rgba(255,255,255,.1); overflow: hidden;
    }
    .hud__barra span {
      display: block; height: 100%; width: 0;
      background: var(--red); border-radius: 999px;
      transition: width .4s ease;
    }

    /* ---------- ações + lista de peças (rodapé) ---------- */
    .acoes {
      flex-shrink: 0;
      background: rgba(13,17,23,.95);
      border-top: 1px solid var(--borda);
      padding: .7rem 1rem .1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      justify-content: center;
    }

    .bandeja {
      flex-shrink: 0;
      background: rgba(13,17,23,.95);
      padding: .7rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      justify-content: center;
      max-height: 26vh;
      overflow-y: auto;
    }

    .peca {
      display: inline-flex;
      align-items: center;
      padding: .5rem .9rem;
      border-radius: 9px;
      border: 1px solid var(--borda);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      font-family: inherit;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .18s, background .18s, color .18s;
    }
    .peca:hover { border-color: var(--red); color: #fff; background: rgba(230,51,41,.2); }

    .peca--acao { border-color: rgba(230,51,41,.55); color: #fff; background: rgba(230,51,41,.18); font-weight: 700; }
    .peca--ativo { background: var(--red); border-color: var(--red); color: #fff; }

    .peca:disabled { opacity: .35; cursor: default; }
    .peca:disabled:hover { border-color: var(--borda); background: rgba(255,255,255,.06); color: var(--txt); }

    /* estados da montagem peça por peça */
    .peca--ok {
      background: rgba(74,222,128,.12);
      border-color: rgba(74,222,128,.4);
      color: #4ade80;
      cursor: default;
    }
    .peca--ok:hover { background: rgba(74,222,128,.12); border-color: rgba(74,222,128,.4); color: #4ade80; }
    .peca--ok .num { background: rgba(74,222,128,.25); color: #4ade80; }

    .peca--vez { border-color: var(--red); background: rgba(230,51,41,.2); color: #fff; }
    .peca--vez .num { background: var(--red); color: #fff; }

    .peca--erro { animation: treme .45s; border-color: var(--red); background: rgba(230,51,41,.3); }
    @keyframes treme {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
    }

    .sem-webgl {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem; color: var(--txt2); font-size: .9rem;
    }

    .so-mobile { display: none; }

    @media (max-width: 760px) {
      .topo { padding: .5rem .6rem; gap: .4rem; }
      .topo__esq { gap: .5rem; }
      .topo__titulo { display: none; }
      .topo__sep { display: none; }
      .topo__logo { font-size: .85rem; }
      .btn-ico { width: 30px; height: 30px; }
      .pilula { min-width: 48px; padding: 0 .5rem; font-size: .72rem; height: 30px; }
      .hud {
        position: static;
        width: auto;
        border-radius: 0;
        border-width: 0 0 1px 0;
        background: rgba(13,17,23,.95);
        padding: .55rem .8rem .6rem;
        backdrop-filter: none;
      }
      .hud__nome { font-size: .88rem; }
      .hud__msg { font-size: .74rem; line-height: 1.45; margin-top: .35rem; }
      .dica-uso { font-size: .66rem; max-width: calc(100% - 1.2rem); }
      .so-desktop { display: none; }
      .so-mobile { display: inline; }
      .acoes { padding: .5rem .4rem .1rem; gap: .3rem; }
      /* no celular a lista de peças vira uma faixa que rola de lado,
         para sobrar o máximo de tela possível para o motor */
      .bandeja {
        flex-wrap: nowrap;
        justify-content: flex-start;
        overflow-x: auto;
        overflow-y: hidden;
        max-height: none;
        padding: .5rem .6rem;
        -webkit-overflow-scrolling: touch;
      }
      .bandeja .peca { flex: 0 0 auto; white-space: nowrap; }
      .peca { font-size: .75rem; padding: .4rem .6rem; }
      .peca--acao { font-size: .72rem; padding: .42rem .5rem; }
      .rotulo { font-size: .62rem; padding: .12rem .45rem; }
    }

    @media (max-width: 400px) {
      .topo__logo { display: none; }
    }
  </style>
</head>
<body>

  <header class="topo">
    <div class="topo__esq">
      <a href="index.html#motores" class="topo__voltar">← Voltar</a>
      <div class="topo__sep"></div>
      <div class="topo__logo">Mecânica<span>Pro</span></div>
      <div class="topo__sep"></div>
      <span class="topo__titulo" id="topo-titulo">Motor em 3D</span>
    </div>
    <div class="topo__dir">
      <button class="btn-ico" id="btn-menos" title="Diminuir zoom">−</button>
      <div class="pilula"><span id="lbl-zoom">100%</span></div>
      <button class="btn-ico" id="btn-mais" title="Aumentar zoom">+</button>
      <button class="btn-ico" id="btn-centro" title="Centralizar">⊙</button>
    </div>
  </header>

  <div class="area">
    <div class="hud">
      <div class="hud__tipo" id="hud-tipo">Motor</div>
      <div class="hud__nome" id="hud-nome">Motor</div>
      <div class="hud__passo" id="hud-passo"></div>
      <div class="hud__barra" id="hud-barra-caixa"><span id="hud-barra"></span></div>
      <div class="hud__msg" id="hud-msg"></div>
    </div>
    <div class="palco">
      <canvas id="canvas3d"></canvas>
      <div id="rotulos"></div>
      <div class="dica-uso" id="dica-uso">
        <span class="so-desktop">Arraste para girar · Scroll para zoom · Shift ou botão direito para mover</span>
        <span class="so-mobile">Arraste para girar · 2 dedos para zoom e mover</span>
      </div>
    </div>
  </div>

  <div class="acoes">
    <button class="peca peca--acao" id="btn-modo">🔧 Montar peça por peça</button>
    <button class="peca peca--acao" id="btn-explodir">💥 Vista explodida</button>
    <button class="peca peca--acao" id="btn-ligar">▶ Ligar o motor</button>
    <button class="peca peca--acao" id="btn-nomes">🏷 Nomes das peças</button>
  </div>

  <div class="bandeja" id="bandeja"></div>

  <script src="montagem-dados.js?v=3"></script>
  <script src="montagem3d.js?v=49" type="module"></script>
  <script src="montagem-pagina.js?v=13"></script>
</body>
</html>
